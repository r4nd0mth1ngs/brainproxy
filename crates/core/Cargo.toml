[package]
name = "brainproxy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "brainproxy engine: HTTP model, raw client, capture store, codecs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true
rusqlite.workspace = true
regex.workspace = true
regex-syntax = "0.8"
flate2.workspace = true
brotli-decompressor.workspace = true
base64.workspace = true
hex.workspace = true
percent-encoding.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
url.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3.55"
getrandom = "0.4.3"
ring = "0.17"
pem = "4.0.0"
similar = "3.2.0"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
