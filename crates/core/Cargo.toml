[package]
name = "brainproxy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "brainproxy engine: HTTP model, raw client, capture store, codecs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true
rusqlite.workspace = true
regex.workspace = true
regex-syntax = "0.8"
aho-corasick = "1.1"
flate2.workspace = true
brotli-decompressor.workspace = true
base64.workspace = true
hex.workspace = true
percent-encoding.workspace = true
md-5.workspace = true
md4 = "0.11"
p12-keystore = "0.4"
sha1.workspace = true
sha2.workspace = true
url.workspace = true
ring = "0.17"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = "0.3.55"
getrandom = "0.4.3"
pem = "4.0.0"
similar = "3.2.0"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
h2 = "0.4"
# HTTP/3: QUIC on the same rustls + ring as TCP. quinn never opens a socket of its own:
# the client hands it a guarded one (see http/h3.rs).
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"
boa_engine = { version = "0.22", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
