id: bp-nginx-known-vulnerabilities-medium-distribution
info:
  name: "nginx version with known medium severity vulnerabilities (distribution package)"
  severity: medium
  confidence: low
  description: |
    The server disclosed its nginx version in a response header, and that version is
    affected by known medium severity vulnerabilities in nginx itself (not third-party modules). The matched
    vulnerabilities are listed in the other info; versions are compared against
    the nginx project's security advisories.
    The header marks the version as a distribution package (a distribution's name in
    a comment, or a package suffix after the version). Distributions usually backport
    security fixes without changing the version, so some or all of these may already
    be fixed: check the package's own advisories before reporting them.
    Covered: CVE-2011-4315, CVE-2011-4963, CVE-2013-2070, CVE-2013-4547, CVE-2014-3556, CVE-2014-3616, CVE-2016-0742, CVE-2016-0746, CVE-2016-0747, CVE-2016-4450, CVE-2017-7529, CVE-2018-16845, CVE-2019-9511, CVE-2021-23017, CVE-2022-41741, CVE-2022-41742, CVE-2024-31079, CVE-2024-32760, CVE-2024-34161, CVE-2024-35200, CVE-2025-23419, CVE-2026-120967, CVE-2026-121810, CVE-2026-123633, CVE-2026-123634, CVE-2026-15176, CVE-2026-1642, CVE-2026-27654, CVE-2026-27784, CVE-2026-28753, CVE-2026-28755, CVE-2026-32647, CVE-2026-40460, CVE-2026-40701, CVE-2026-42055, CVE-2026-42926, CVE-2026-42945, CVE-2026-42946, CVE-2026-56434, CVE-2026-60005, CVE-2026-90439, CVE-2026-9256, CVE-2026-93479, CVE-2026-95101, CVE-2026-97205, CVE-2026-97629.
  remediation: |
    Upgrade nginx to a supported version that includes the fixes for the listed
    vulnerabilities. Also stop the server disclosing its version: set
    server_tokens off.
  reference:
    - https://nginx.org/en/security_advisories.html
  classification:
    cwe-id: CWE-1395
  tags: nginx,cve,version,passive,medium
scope: passive
