id: bp-nginx-known-vulnerabilities-low-distribution
info:
  name: "nginx version with known low severity vulnerabilities (distribution package)"
  severity: low
  confidence: low
  description: |
    The server disclosed its nginx version in a response header, and that version is
    affected by known low severity vulnerabilities in nginx itself (not third-party modules). The matched
    vulnerabilities are listed in the other info; versions are compared against
    the nginx project's security advisories.
    The header marks the version as a distribution package (a distribution's name in
    a comment, or a package suffix after the version). Distributions usually backport
    security fixes without changing the version, so some or all of these may already
    be fixed: check the package's own advisories before reporting them.
    Covered: CVE-2009-3898, CVE-2018-16843, CVE-2018-16844, CVE-2019-9513, CVE-2019-9516, CVE-2024-7347, CVE-2025-53859, CVE-2026-120993, CVE-2026-123640, CVE-2026-125283, CVE-2026-27651, CVE-2026-42934, CVE-2026-48142.
  remediation: |
    Upgrade nginx to a supported version that includes the fixes for the listed
    vulnerabilities. Also stop the server disclosing its version: set
    server_tokens off.
  reference:
    - https://nginx.org/en/security_advisories.html
  classification:
    cwe-id: CWE-1395
  tags: nginx,cve,version,passive,low
scope: passive
http:
  - extractors:
      - type: regex
        name: line
        internal: true
        part: header
        group: 1
        regex:
          - '(?im)^([^\r\n]*(?:^|[^\w-])nginx/\d{1,6}\.\d{1,6}\.\d{1,6}\b[^\r\n]*)'
      - type: dsl
        name: nginx
        dsl:
          - "replace_regex(line, '(?i)^(?:.*?(?:^|[^\\w-])nginx/(\\d{1,6}\\.\\d{1,6}\\.\\d{1,6})\\b(?:-[\\w.+~]{0,40}?(?:ubuntu|deb|el\\d|fc\\d|mga|suse|alpine).*|.*\\([^()]{0,60}\\b(?:Debian|Ubuntu|Raspbian|Red ?Hat|RHEL|CentOS|Fedora|Rocky|Alma(?:Linux)?|Oracle|SUSE|openSUSE|SLES|Amazon|Gentoo|Mageia|Mint|FreeBSD|OpenBSD|NetBSD)\\b[^()]{0,60}\\).*)|.*\\([^()]{0,60}\\b(?:Debian|Ubuntu|Raspbian|Red ?Hat|RHEL|CentOS|Fedora|Rocky|Alma(?:Linux)?|Oracle|SUSE|openSUSE|SLES|Amazon|Gentoo|Mageia|Mint|FreeBSD|OpenBSD|NetBSD)\\b[^()]{0,60}\\).*?(?:^|[^\\w-])nginx/(\\d{1,6}\\.\\d{1,6}\\.\\d{1,6})\\b.*|.*)$', '${1}${2}')"
    matchers-condition: or
    matchers:
      - type: dsl
        name: "CVE-2026-27651 NULL pointer dereference while using CRAM-MD5 or APOP"
        dsl:
          - "compare_versions(nginx, '>= 0.5.15, < 1.28.3') || compare_versions(nginx, '>= 1.29.0, < 1.29.7')"
      - type: dsl
        name: "CVE-2019-9513 Excessive CPU usage in HTTP/2 with priority changes"
        dsl:
          - "compare_versions(nginx, '>= 1.9.5, < 1.16.1') || compare_versions(nginx, '>= 1.17.0, < 1.17.3')"
      - type: dsl
        name: "CVE-2019-9516 Excessive memory usage in HTTP/2 with zero length headers"
        dsl:
          - "compare_versions(nginx, '>= 1.9.5, < 1.16.1') || compare_versions(nginx, '>= 1.17.0, < 1.17.3')"
      - type: dsl
        name: "CVE-2026-120993 NULL pointer dereference when using PROXY protocol version 2"
        dsl:
          - "compare_versions(nginx, '>= 1.31.4, < 1.31.9')"
      - type: dsl
        name: "CVE-2026-123640 Insufficient validation in stream ssl_preread module"
        dsl:
          - "compare_versions(nginx, '>= 1.15.2, < 1.30.7') || compare_versions(nginx, '>= 1.31.0, < 1.31.9')"
      - type: dsl
        name: "CVE-2026-125283 Buffer overflow when using alias with try_files"
        dsl:
          - "compare_versions(nginx, '>= 0.9.6, < 1.30.7') || compare_versions(nginx, '>= 1.31.0, < 1.31.9')"
      - type: dsl
        name: "CVE-2025-53859 Buffer overread in the ngx_mail_smtp_module"
        dsl:
          - "compare_versions(nginx, '>= 0.7.22, < 1.29.1')"
      - type: dsl
        name: "CVE-2026-42934 Buffer overread in the ngx_http_charset_module"
        dsl:
          - "compare_versions(nginx, '>= 0.3.50, < 1.30.1')"
      - type: dsl
        name: "CVE-2026-48142 Buffer overread in the ngx_http_charset_module"
        dsl:
          - "compare_versions(nginx, '>= 0.3.50, < 1.30.3') || compare_versions(nginx, '>= 1.31.0, < 1.31.2')"
      - type: dsl
        name: "CVE-2024-7347 Buffer overread in the ngx_http_mp4_module"
        dsl:
          - "compare_versions(nginx, '>= 1.5.13, < 1.26.2') || compare_versions(nginx, '>= 1.27.0, < 1.27.1')"
      - type: dsl
        name: "CVE-2018-16843 Excessive memory usage in HTTP/2"
        dsl:
          - "compare_versions(nginx, '>= 1.9.5, < 1.14.1') || compare_versions(nginx, '>= 1.15.0, < 1.15.6')"
      - type: dsl
        name: "CVE-2018-16844 Excessive CPU usage in HTTP/2"
        dsl:
          - "compare_versions(nginx, '>= 1.9.5, < 1.14.1') || compare_versions(nginx, '>= 1.15.0, < 1.15.6')"
      - type: dsl
        name: "CVE-2009-3898 Directory traversal vulnerability"
        dsl:
          - "compare_versions(nginx, '>= 0.1.0, < 0.7.63') || compare_versions(nginx, '>= 0.8.0, < 0.8.17')"
