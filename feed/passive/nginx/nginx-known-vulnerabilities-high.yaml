id: bp-nginx-known-vulnerabilities-high
info:
  name: "nginx version with known high severity vulnerabilities"
  severity: high
  confidence: medium
  description: |
    The server disclosed its nginx version in a response header, and that version is
    affected by known high severity vulnerabilities in nginx itself (not third-party modules). The matched
    vulnerabilities are listed in the other info; versions are compared against
    the nginx project's security advisories.
    Some distributions backport security fixes without changing the version number,
    so check whether the fixes have been applied before reporting these as confirmed.
    Covered: CORE-2010-0121, CVE-2009-2629, CVE-2009-3555, CVE-2009-3896, CVE-2010-2263, CVE-2010-2266, CVE-2012-1180, CVE-2012-2089, CVE-2013-2028, CVE-2014-0088, CVE-2014-0133, CVE-2024-24989, CVE-2024-24990, CVE-2026-113425, CVE-2026-118899, CVE-2026-123007, CVE-2026-42530, CVE-2026-42533.
  remediation: |
    Upgrade nginx to a supported version that includes the fixes for the listed
    vulnerabilities. Also stop the server disclosing its version: set
    server_tokens off.
  reference:
    - https://nginx.org/en/security_advisories.html
  classification:
    cwe-id: CWE-1395
  tags: nginx,cve,version,passive,high
scope: passive
http:
  - extractors:
      - type: regex
        name: line
        internal: true
        part: header
        group: 1
        regex:
          - '(?im)^([^\r\n]*(?:^|[^\w-])nginx/\d{1,6}\.\d{1,6}\.\d{1,6}\b[^\r\n]*)'
      - type: dsl
        name: nginx
        dsl:
          - "replace_regex(line, '(?i)^(?:.*(?:\\([^()]{0,60}\\b(?:Debian|Ubuntu|Raspbian|Red ?Hat|RHEL|CentOS|Fedora|Rocky|Alma(?:Linux)?|Oracle|SUSE|openSUSE|SLES|Amazon|Gentoo|Mageia|Mint|FreeBSD|OpenBSD|NetBSD)\\b[^()]{0,60}\\)|nginx/\\d{1,6}\\.\\d{1,6}\\.\\d{1,6}-[\\w.+~]{0,40}?(?:ubuntu|deb|el\\d|fc\\d|mga|suse|alpine)).*|.*?(?:^|[^\\w-])nginx/(\\d{1,6}\\.\\d{1,6}\\.\\d{1,6})\\b.*)$', '${1}')"
    matchers-condition: or
    matchers:
      - type: dsl
        name: "CVE-2026-113425 Use-after-free in mail proxy module"
        dsl:
          - "compare_versions(nginx, '>= 0.5.33, < 1.30.7') || compare_versions(nginx, '>= 1.31.0, < 1.31.9')"
      - type: dsl
        name: "CVE-2026-123007 Memory corruption in HTTP/2 flow control"
        dsl:
          - "compare_versions(nginx, '>= 1.9.5, < 1.30.7') || compare_versions(nginx, '>= 1.31.0, < 1.31.9')"
      - type: dsl
        name: "CVE-2026-42530 Use-after-free in HTTP/3"
        dsl:
          - "compare_versions(nginx, '>= 1.31.0, < 1.31.2')"
      - type: dsl
        name: "CVE-2026-42533 Buffer overflow when using map and regex"
        dsl:
          - "compare_versions(nginx, '>= 0.9.6, < 1.30.4') || compare_versions(nginx, '>= 1.31.0, < 1.31.3')"
      - type: dsl
        name: "CVE-2026-118899 Infinite loop while reading client request body over TLS 1.3"
        dsl:
          - "compare_versions(nginx, '>= 1.13.0, < 1.30.7') || compare_versions(nginx, '>= 1.31.0, < 1.31.9')"
      - type: dsl
        name: "CVE-2024-24989 NULL pointer dereference in HTTP/3"
        dsl:
          - "compare_versions(nginx, '>= 1.25.3, < 1.25.4')"
      - type: dsl
        name: "CVE-2024-24990 Use-after-free in HTTP/3"
        dsl:
          - "compare_versions(nginx, '>= 1.25.0, < 1.25.4')"
      - type: dsl
        name: "CORE-2010-0121 Vulnerabilities with Windows 8.3 filename pseudonyms (assumed: only nginx on Windows is affected)"
        dsl:
          - "compare_versions(nginx, '>= 0.7.52, < 0.7.65') || compare_versions(nginx, '>= 0.8.0, < 0.8.33')"
      - type: dsl
        name: "CVE-2009-2629 Buffer underflow vulnerability"
        dsl:
          - "compare_versions(nginx, '>= 0.1.0, < 0.5.38') || compare_versions(nginx, '>= 0.6.0, < 0.6.39') || compare_versions(nginx, '>= 0.7.0, < 0.7.62') || compare_versions(nginx, '>= 0.8.0, < 0.8.15')"
      - type: dsl
