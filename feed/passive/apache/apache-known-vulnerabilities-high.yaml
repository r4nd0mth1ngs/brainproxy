id: bp-apache-known-vulnerabilities-high
info:
  name: "Apache HTTP Server version with known high severity vulnerabilities"
  severity: high
  confidence: medium
  description: |
    The server disclosed its Apache HTTP Server version in a response header, and that version is
    affected by known high severity vulnerabilities in Apache HTTP Server itself. The matched
    vulnerabilities are listed in the other info; versions are compared against
    the Apache HTTP Server project's security advisories.
    Some distributions backport security fixes without changing the version number,
    so check whether the fixes have been applied before reporting these as confirmed.
