# Generated by scripts/version_feed.py from ZAP's apache-known-vulnerabilities.json (2026-11-18).
# Covers ZAP ServerSideVersionScanRule (pscanrules, Apache License 2.0). Don't edit by hand.
id: bp-apache-known-vulnerabilities-critical-distribution
info:
  name: "Apache HTTP Server version with known critical severity vulnerabilities (distribution package)"
  severity: critical
  confidence: low
  description: |
    The server disclosed its Apache HTTP Server version in a response header, and that version is
    affected by known critical severity vulnerabilities in Apache HTTP Server itself. The matched
    vulnerabilities are listed in the other info; versions are compared against
    the Apache HTTP Server project's security advisories.
    The header marks the version as a distribution package (a distribution's name in
    a comment, or a package suffix after the version). Distributions usually backport
    security fixes without changing the version, so some or all of these may already
    be fixed: check the package's own advisories before reporting them.
    Covered: CVE-2002-0061, CVE-2002-0392, CVE-2003-0016, CVE-2003-0245, CVE-2004-0786, CVE-2021-41773, CVE-2021-42013, CVE-2026-119618.
  remediation: |
    Upgrade Apache HTTP Server to a supported version that includes the fixes for
    the listed vulnerabilities. Also stop the server disclosing its version: set
    ServerTokens Prod and ServerSignature Off.
  reference:
    - https://httpd.apache.org/security/vulnerabilities_24.html
    - https://httpd.apache.org/security/
  classification:
    cwe-id: CWE-1395
  tags: apache,cve,version,passive,critical
scope: passive
http:
  - extractors:
      - type: regex
        name: line
        internal: true
        part: header
        group: 1
        regex:
          - '(?im)^([^\r\n]*(?:^|[^\w-])Apache/\d{1,6}\.\d{1,6}\.\d{1,6}\b[^\r\n]*)'
      - type: dsl
        name: apache
        dsl:
          - "replace_regex(line, '(?i)^(?:.*?(?:^|[^\\w-])Apache/(\\d{1,6}\\.\\d{1,6}\\.\\d{1,6})\\b(?:-[\\w.+~]{0,40}?(?:ubuntu|deb|el\\d|fc\\d|mga|suse|alpine).*|.*\\([^()]{0,60}\\b(?:Debian|Ubuntu|Raspbian|Red ?Hat|RHEL|CentOS|Fedora|Rocky|Alma(?:Linux)?|Oracle|SUSE|openSUSE|SLES|Amazon|Gentoo|Mageia|Mint|FreeBSD|OpenBSD|NetBSD)\\b[^()]{0,60}\\).*)|.*\\([^()]{0,60}\\b(?:Debian|Ubuntu|Raspbian|Red ?Hat|RHEL|CentOS|Fedora|Rocky|Alma(?:Linux)?|Oracle|SUSE|openSUSE|SLES|Amazon|Gentoo|Mageia|Mint|FreeBSD|OpenBSD|NetBSD)\\b[^()]{0,60}\\).*?(?:^|[^\\w-])Apache/(\\d{1,6}\\.\\d{1,6}\\.\\d{1,6})\\b.*|.*)$', '${1}${2}')"
    matchers-condition: or
    matchers:
      - type: dsl
        name: "CVE-2002-0061 Win32 Apache Remote command execution"
        dsl:
          - "compare_versions(apache, '>= 1.3.22, < 1.3.24')"
      - type: dsl
        name: "CVE-2002-0061 Win32 Apache Remote command execution (assumed: the project lists this version as possibly affected)"
        dsl:
          - "compare_versions(apache, '>= 1.3.0, < 1.3.22')"
      - type: dsl
        name: "CVE-2002-0392 Apache Chunked encoding vulnerability"
        dsl:
          - "compare_versions(apache, '>= 1.3.0, < 1.3.26') || compare_versions(apache, '>= 2.0.35, < 2.0.37')"
      - type: dsl
        name: "CVE-2003-0016 MS-DOS device name filtering"
        dsl:
          - "compare_versions(apache, '>= 2.0.43, < 2.0.44')"
      - type: dsl
        name: "CVE-2003-0016 MS-DOS device name filtering (assumed: the project lists this version as possibly affected)"
        dsl:
          - "compare_versions(apache, '>= 2.0.35, < 2.0.43')"
      - type: dsl
        name: "CVE-2003-0245 APR remote crash"
        dsl:
          - "compare_versions(apache, '>= 2.0.37, < 2.0.46')"
      - type: dsl
        name: "CVE-2004-0786 IPv6 URI parsing heap overflow"
        dsl:
          - "compare_versions(apache, '>= 2.0.35, < 2.0.51')"
      - type: dsl
        name: "CVE-2021-41773 Path traversal and file disclosure vulnerability in Apache HTTP Server 2.4.49"
        dsl:
          - "compare_versions(apache, '>= 2.4.49, < 2.4.50')"
      - type: dsl
        name: "CVE-2021-42013 Path Traversal and Remote Code Execution in Apache HTTP Server 2.4.49 and 2.4.50 (incomplete fix of CVE-2021-41773)"
        dsl:
          - "compare_versions(apache, '>= 2.4.49, < 2.4.51')"
      - type: dsl
        name: "CVE-2026-119618 mod_http2: heap corruption and RCE in assign_headers"
        dsl:
          - "compare_versions(apache, '>= 2.4.55, < 2.4.71')"
