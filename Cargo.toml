[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/r4nd0mth1ngs/brainproxy"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
httparse = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
regex = "1"
flate2 = "1"
brotli-decompressor = "6"
base64 = "0.23"
hex = "0.4"
percent-encoding = "2"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
url = "2"
clap = { version = "4", features = ["derive", "env", "string"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
