name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual runs build the desktop bundles without publishing a release.
  workflow_dispatch:

# Read-only by default; the jobs that publish release assets ask for more.
permissions:
  contents: read

# A newer push to the same PR supersedes the running checks; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Release files are named after Cargo.toml's version, and the updater looks for
      # them under the tag's, so a release tag has to match it.
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --no-fail-fast

  static:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload release assets on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pattern allows for the CRLF checkout Windows runners make.
      - name: Asset name
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "ASSET=brainproxy-$version-$PLATFORM" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
      # No cache on release builds, so a poisoned cache can't reach published binaries.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build (x86_64, musl-gcc)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          make static TARGET="$TARGET"
      - name: Build (arm64, zig as cross C compiler)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip install ziglang==0.17.0
          cargo install cargo-zigbuild --locked
          make static-arm64
      - name: Smoke test
        run: |
          bin="target/$TARGET/release/brainproxy"
          if [ "$TARGET" = "aarch64-unknown-linux-musl" ]; then
            # Newer Ubuntu images ship qemu-user only (static, no -static suffix).
            # Refresh the index first: the image's cached one can point at removed .debs (404).
            sudo apt-get update && sudo apt-get install -y qemu-user
            run="qemu-aarch64 $bin"
          else
            run="$bin"
          fi
          file "$bin"
          $run --version
          $run --format json --project /tmp/smoke.bpdb capabilities > /dev/null
          $run --format json --project /tmp/smoke.bpdb engagement start --target 127.0.0.1
      - run: |
          cp "target/$TARGET/release/brainproxy" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  # The container image: built and smoke-tested here, not pushed anywhere.
  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t brainproxy:ci .
      - name: Smoke test
        run: |
          docker run --rm brainproxy:ci --version
          docker run --rm brainproxy:ci --format json capabilities > /dev/null
          # A project on a bind mount owned by the runner's user.
          mkdir smoke
          run="docker run --rm --user $(id -u):$(id -g) -v $PWD/smoke:/work brainproxy:ci --format json"
          $run engagement start --target 127.0.0.1
          $run ca init > /dev/null
          ls -la smoke
          test -f smoke/brainproxy.bpdb
          test -d smoke/.brainproxy/ca

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload release assets on tags
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: windows-x86_64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pattern allows for the CRLF checkout Windows runners make.
      - name: Asset name
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "ASSET=brainproxy-$version-$PLATFORM" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # No cache on release builds, so a poisoned cache can't reach published binaries.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release -p brainproxy
      - name: Smoke test
        run: |
          bin=target/release/brainproxy.exe
          $bin --version
          $bin --format json --project smoke.bpdb capabilities > /dev/null
          $bin --format json --project smoke.bpdb engagement start --target 127.0.0.1
      - run: |
          cp target/release/brainproxy.exe "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  # The desktop GUI (gui/): type-check and build the frontend on every push.
  gui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Desktop bundles with the CLI inside (Tauri sidecar), on tags and manual runs.
  gui:
    needs: [check, gui-check]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write # upload release assets on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pattern allows for the CRLF checkout Windows runners make.
      - name: Asset name
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo "::error::no version in Cargo.toml"; exit 1; }
          echo "ASSET=brainproxy-gui-$version-$PLATFORM" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable
      # No caches on release builds, so a poisoned cache can't reach published bundles.
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gui-${{ matrix.target }}
          workspaces: |
            . -> target
            gui/src-tauri -> target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}
          cache-dependency-path: gui/package-lock.json
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the CLI sidecar
        run: |
          cargo build --release --target "$TARGET" -p brainproxy
          mkdir -p gui/src-tauri/binaries
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cp "target/$TARGET/release/brainproxy$exe" "gui/src-tauri/binaries/brainproxy-$TARGET$exe"
      - run: npm ci
        working-directory: gui
      - name: Bundle
        working-directory: gui
        # externalBin only here, so local `cargo tauri dev` needs no sidecar file.
        run: npx tauri build --target "$TARGET" --config '{"bundle":{"externalBin":["binaries/brainproxy"]}}'
      - name: Collect bundles
        run: |
          dir="gui/src-tauri/target/$TARGET/release/bundle"
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$dir"/dmg/*.dmg "out/$ASSET.dmg"
          elif [ "$RUNNER_OS" = Windows ]; then
            cp "$dir"/msi/*.msi "out/$ASSET.msi"
            cp "$dir"/nsis/*-setup.exe "out/$ASSET-setup.exe"
          else
            cp "$dir"/deb/*.deb "out/$ASSET.deb"
            cp "$dir"/appimage/*.AppImage "out/$ASSET.AppImage"
          fi
          sum() { if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          cd out && for f in *; do sum "$f" > "$f.sha256"; done && ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: out/*
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*

  # One SHA256SUMS over every release file, for `sha256sum -c SHA256SUMS`.
  checksums:
    needs: [static, windows, gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets on tags
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: brainproxy-*
          path: assets
          merge-multiple: true
      - run: |
          cd assets
          ls | grep -v '\.sha256$' | sort | xargs sha256sum > ../SHA256SUMS
          cat ../SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: SHA256SUMS
