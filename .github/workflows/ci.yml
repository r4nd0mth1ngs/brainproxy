name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  static:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: brainproxy-linux-x86_64
          - target: aarch64-unknown-linux-musl
            asset: brainproxy-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (x86_64, musl-gcc)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          make static TARGET=${{ matrix.target }}
      - name: Build (arm64, zig as cross C compiler)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip install ziglang==0.17.0
          cargo install cargo-zigbuild --locked
          make static-arm64
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/brainproxy
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y qemu-user-static
            run="qemu-aarch64-static $bin"
          else
            run="$bin"
          fi
          file "$bin"
          $run --version
          $run --format json --project /tmp/smoke.bpdb capabilities > /dev/null
          $run --format json --project /tmp/smoke.bpdb engagement start --target 127.0.0.1
      - run: |
          cp target/${{ matrix.target }}/release/brainproxy ${{ matrix.asset }}
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
