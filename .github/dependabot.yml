version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Let a release age a week before adopting it (security updates skip this).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The base images pinned in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps

  # The CLI workspace and the Tauri app are separate Cargo workspaces;
  # one grouped PR covers both.
  - package-ecosystem: cargo
    directories:
      - /
      - /gui/src-tauri
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: deps
