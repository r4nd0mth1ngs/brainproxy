[package]
name = "brainproxy-gui"
version = "0.4.5"
edition = "2021"
license = "Apache-2.0"
description = "Desktop GUI for brainproxy"

# Built on its own (needs the frontend build and a webview), not with the CLI workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util"] }

# Temp folder checks (owner, mode, tmpfs) for temporary engagements.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
